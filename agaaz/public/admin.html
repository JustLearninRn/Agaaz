<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><title>AGAAZ 2k26 · Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>.panel{animation-delay:0s}.hero{padding:10px 0}.hero h1{font-size:clamp(2rem,7vw,3.4rem)}</style>
</head><body>
<canvas id="sp"></canvas><div class="beam a"></div><div class="beam b"></div>
<main>
<div class="hero"><small>BACKSTAGE · ADMIN PORTAL</small><h1>AGAAZ 2k26</h1></div>
<div id="app"></div>
</main>
<script src="/common.js"></script>
<script>
let tok=sessionStorage.getItem('agaaz_tok')||'',D={contestants:[],votes:[],open:true},tab='results',X={id:null,name:'',gender:'M',talent:'',image:'',img:0},armed=null,err='',pwv='',timer;
const nm=id=>D.contestants.find(c=>c.id===id)?.name||'(removed)';
async function api(p,method='GET',data){
  const r=await fetch('/api/'+p,{method,headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:data?JSON.stringify(data):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&p!=='admin/login'){logout();throw new Error('Session expired')}
  if(!r.ok)throw new Error(j.error||'Request failed');return j;
}
function logout(){tok='';sessionStorage.removeItem('agaaz_tok');clearInterval(timer);render()}
async function login(){
  try{const j=await api('admin/login','POST',{password:pwv});tok=j.token;sessionStorage.setItem('agaaz_tok',tok);err='';pwv='';await refresh();timer=setInterval(()=>{if(!X.image)refresh()},10000)}
  catch(e){err=e.message;render()}
}
async function refresh(){try{D=await api('admin/data');render()}catch(e){}}
function danger(key,fn){if(armed===key){armed=null;fn()}else{armed=key;render();setTimeout(()=>{if(armed===key){armed=null;render()}},4000)}}
const dbtn=(key,label,fn)=>`<button class="red" onclick="danger('${key}',()=>${fn})">${armed===key?'Click again to confirm':label}</button>`;
const tally=()=>{const m={},f={};D.votes.forEach(v=>{m[v.m]=(m[v.m]||0)+1;f[v.f]=(f[v.f]||0)+1});return{M:m,F:f}};

function render(){
  const a=$('#app');
  if(!tok){a.innerHTML=`<div class="panel"><h2 style="margin-top:0">Admin Login<span>Staff only</span></h2><label>PASSWORD</label><input type="password" id="pw" value="${esc(pwv)}" oninput="pwv=this.value" onkeydown="if(event.key==='Enter')login()" autofocus>${err?`<p style="color:#ff8d96;text-align:center">${esc(err)}</p>`:''}<button class="cta" onclick="login()">Enter</button></div>`;return}
  const tabs=['results','contestants','voters','settings'];
  a.innerHTML=`<div class="flex" style="margin:0 0 14px">${tabs.map(t=>`<button class="${tab===t?'on':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}<button onclick="logout()">Log out</button></div><div id="tb"></div>`;
  $('#tb').innerHTML=({results:tResults,contestants:tCont,voters:tVoters,settings:tSet})[tab]();
}
function resBlock(g,title){
  const t=tally()[g],list=D.contestants.filter(c=>c.gender===g).map(c=>({...c,n:t[c.id]||0})).sort((a,b)=>b.n-a.n),top=list[0]?.n||0,tot=list.reduce((s,c)=>s+c.n,0);
  return `<div class="panel wide"><h2 style="margin-top:0">${title}<span>${tot} votes</span></h2>`+(list.map(c=>`<div class="row"><div class="th" ${imgStyle(c)}></div><div class="gr"><b class="cz">${esc(c.name)}</b>${top>0&&c.n===top?`<span class="chip">${g==='M'?'LEADING MR':'LEADING MISS'}</span>`:''}<div class="bar"><i style="width:${top?c.n/top*100:0}%"></i></div></div><div class="cz" style="font-size:1.3rem;color:var(--gold2)">${c.n}</div></div>`).join('')||'<p class="mut">No contestants yet.</p>')+'</div>';
}
function tResults(){return `<p class="mut">Live results (auto-refreshing) · ${D.votes.length} total voters</p>`+resBlock('M','MR. FRESHER')+resBlock('F','MISS FRESHER')+`<div class="flex"><button onclick="dlResults()">⬇ Download results</button><button onclick="dlVoters()">⬇ Download voter list</button></div>`}
function tCont(){
  const rows=D.contestants.map(c=>`<div class="row"><div class="th" ${imgStyle(c)}></div><div class="gr"><b class="cz">${esc(c.name)}</b><span class="chip">${c.gender==='M'?'MR':'MISS'}</span><br><em class="mut">${esc(c.talent)}</em></div><button onclick="editC('${esc(c.id)}')">Edit</button>${dbtn('dc'+c.id,'Delete',`delC('${esc(c.id)}')`)}</div>`).join('');
  const pv=X.image?`style="background-image:url('${X.image}')"`:imgStyle(X);
  return `<div class="panel wide"><h2 style="margin-top:0">${X.id?'Edit Contestant':'Add Contestant'}</h2>
  <label>NAME</label><input value="${esc(X.name)}" oninput="X.name=this.value">
  <label>CATEGORY</label><select onchange="X.gender=this.value"><option value="M" ${X.gender==='M'?'selected':''}>Mr. Fresher (boy)</option><option value="F" ${X.gender==='F'?'selected':''}>Miss Fresher (girl)</option></select>
  <label>TALENT PRESENTED</label><input value="${esc(X.talent)}" oninput="X.talent=this.value">
  <label>PHOTO</label><input type="file" accept="image/*" onchange="pickImg(this.files[0])">
  ${(X.image||X.img)?`<div class="row"><div class="th" ${pv}></div><span class="mut">Photo ready</span></div>`:''}
  <div class="flex"><button onclick="saveC()">${X.id?'Save changes':'Add contestant'}</button>${X.id?'<button onclick="clearX()">Cancel</button>':''}</div></div>
  <div class="panel wide">${rows||'<p class="mut">No contestants yet.</p>'}</div>`;
}
function tVoters(){
  return `<div class="panel wide"><h2 style="margin-top:0">Voters<span>${D.votes.length} registered votes</span></h2><div class="tbl"><table><tr><th>Reg No</th><th>Name</th><th>Phone</th><th>Mr pick</th><th>Miss pick</th><th></th></tr>`+
  [...D.votes].sort((a,b)=>b.t-a.t).map(v=>`<tr><td>${esc(v.reg)}</td><td>${esc(v.name)}</td><td>${esc(v.phone)}</td><td>${esc(nm(v.m))}</td><td>${esc(nm(v.f))}</td><td>${dbtn('dv'+v.id,'Remove',`delV('${esc(v.id)}')`)}</td></tr>`).join('')+'</table></div></div>';
}
function tSet(){
  return `<div class="panel wide" style="text-align:center"><h2 style="margin-top:0">Poll Controls</h2>
  <p class="mut">Voting is currently <b style="color:var(--gold2)">${D.open?'OPEN':'CLOSED'}</b></p>
  <div class="flex"><button onclick="toggle()">${D.open?'Close voting':'Open voting'}</button>
  ${dbtn('rv','Reset all votes (progress)',"reset(false)")}${dbtn('ra','Reset everything',"reset(true)")}</div>
  <p class="mut" style="font-size:.85rem;margin-top:18px">Resetting votes frees every registration number to vote again. Resetting everything also removes all contestants and photos.</p></div>`;
}
function editC(id){const c=D.contestants.find(x=>x.id===id);X={id,name:c.name,gender:c.gender,talent:c.talent||'',image:'',img:c.img};render();scrollTo(0,0)}
function clearX(){X={id:null,name:'',gender:'M',talent:'',image:'',img:0};render()}
function pickImg(f){
  if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);X.image=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);render()};
  im.onerror=()=>toast('Could not read that image');im.src=u;
}
async function saveC(){
  if(!X.name.trim())return toast('Enter a name');
  try{await api('admin/contestant','POST',{id:X.id,name:X.name,gender:X.gender,talent:X.talent,image:X.image});toast('Saved');clearX();await refresh()}catch(e){toast(e.message)}
}
async function delC(id){try{await api('admin/contestant/'+id,'DELETE');await refresh()}catch(e){toast(e.message)}}
async function delV(id){try{await api('admin/vote/'+id,'DELETE');await refresh()}catch(e){toast(e.message)}}
async function toggle(){try{await api('admin/settings','POST',{open:!D.open});await refresh()}catch(e){toast(e.message)}}
async function reset(all){try{await api('admin/reset','POST',{all});toast('Reset complete');await refresh()}catch(e){toast(e.message)}}
const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
function save(name,rows){const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function dlResults(){const t=tally(),r=[['Category','Contestant','Talent','Votes']];
  ['M','F'].forEach(g=>D.contestants.filter(c=>c.gender===g).map(c=>[g==='M'?'Mr Fresher':'Miss Fresher',c.name,c.talent,t[g][c.id]||0]).sort((a,b)=>b[3]-a[3]).forEach(x=>r.push(x)));
  save('agaaz2k26-results.csv',r)}
function dlVoters(){save('agaaz2k26-voters.csv',[['Reg No','Name','Phone','Mr Fresher pick','Miss Fresher pick','Time'],...D.votes.map(v=>[v.reg,v.name,v.phone,nm(v.m),nm(v.f),new Date(v.t).toLocaleString()])])}
render();if(tok){refresh().then(()=>{timer=setInterval(()=>{if(!X.image)refresh()},10000)})}
</script></body></html>
